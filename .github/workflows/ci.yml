name: CI/CD for Blog Application

on:
  push:
    branches:
      - main
    tags: # <--- CRITICAL FIX: Add this line to trigger on tags
      - 'v*'
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  # ----------------------------------------------------------------------
  # 1. BUILD JOB (CI Quality Gate)
  # This job runs tests and prepares artifacts. It must succeed for deployment.
  # ----------------------------------------------------------------------
  build:
    runs-on: ubuntu-latest
    
    steps:
      # Step 1: Checkout repository
      - name: Checkout code
        uses: actions/checkout@v4 # Recommended: Use latest action version

      # Frontend Setup (React + Vite)
      - name: Set up Node.js
        uses: actions/setup-node@v4 # Synchronized to v4
        with:
          node-version: '22.13.1'

      - name: Install frontend dependencies
        run: npm install
        working-directory: ./team_blog_frontend

      - name: Run frontend tests and linting
        run: npm run lint && npm run test
        working-directory: ./team_blog_frontend

      - name: Build frontend (Generates 'dist')
        run: npm run build
        working-directory: ./team_blog_frontend
        
      # CRITICAL STEP: Upload the compiled 'dist' folder for deployment
      - name: Archive frontend build artifacts
        uses: actions/upload-artifact@v4 # Synchronized to v4
        with:
          name: frontend-dist
          path: ./team_blog_frontend/dist

      # Backend Setup (Django + DRF)
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install backend dependencies
        run: pip install -r requirements.txt
        working-directory: ./team_blog_backend

      - name: Run backend tests and linting
        run: flake8 . && python manage.py test
        working-directory: ./team_blog_backend
        
  # ----------------------------------------------------------------------
  # 2. DEPLOY FRONTEND TO VERCEL (CD Stage)
  # Runs ONLY if the 'build' job passed successfully.
  # ----------------------------------------------------------------------
  deploy_frontend:
    needs: [build] # <-- Quality Gate
    runs-on: ubuntu-latest
    environment: staging_vercel 
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4 # Synchronized to v4

      # Download the pre-built 'dist' folder
      - name: Download frontend build artifact
        uses: actions/download-artifact@v4 # Synchronized to v4
        with:
          name: frontend-dist
          path: ./team_blog_frontend/dist
        
      - name: Install Vercel CLI
        run: npm install -g vercel

      # Deploy the artifact using the Vercel CLI and SECRETS
      - name: Trigger Vercel Deployment via Hook
        run: curl -X POST ${{ secrets.VERCEL_DEPLOY_HOOK }}
          
  # ----------------------------------------------------------------------
  # 3. DEPLOY BACKEND TO RENDER (CD Stage)
  # Runs ONLY if the 'build' job passed successfully.
  # ----------------------------------------------------------------------
  deploy_backend:
    needs: [build] # <-- Quality Gate
    runs-on: ubuntu-latest
    environment: staging_render
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    
    steps:
      # Trigger Render Deployment using the Deploy Hook URL stored in secrets
      - name: Trigger Render Backend Staging Deployment
        run: |
          # Use curl to make a POST request to the Render Webhook
          curl -X POST ${{ secrets.RENDER_DEPLOY_HOOK }}

  # ----------------------------------------------------------------------
  # 4. DEPLOY FRONTEND TO VERCEL (CD PRODUCTION Stage)
  # Runs ONLY if the 'build' job passed and a Git tag was pushed.
  # ----------------------------------------------------------------------
  deploy_frontend_prod: # <--- 2. NEW PRODUCTION JOB
    needs: [build]
    runs-on: ubuntu-latest
    environment: production_vercel 
    # Only run on tags (e.g., v1.0.0)
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Download the pre-built 'dist' folder
      - name: Download frontend build artifact
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: ./team_blog_frontend/dist
        
      - name: Install Vercel CLI
        run: npm install -g vercel

      # Deploy the artifact using the dedicated Production Hook
      - name: Trigger Vercel Deployment via Hook (Production)
        run: curl -X POST ${{ secrets.VERCEL_PROD_HOOK }}

  # ----------------------------------------------------------------------
  # 5. DEPLOY BACKEND TO RENDER (CD PRODUCTION Stage)
  # Runs ONLY if the 'build' job passed and a Git tag was pushed.
  # ----------------------------------------------------------------------
  deploy_backend_prod: # <--- 3. NEW PRODUCTION JOB
    needs: [build]
    runs-on: ubuntu-latest
    environment: production_render
    # Only run on tags (e.g., v1.0.0)
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    
    steps:
      # Trigger Render Deployment using the dedicated Production Hook
      - name: Trigger Render Backend Production Deployment
        run: |
          curl -X POST ${{ secrets.RENDER_PROD_HOOK }}

  # ----------------------------------------------------------------------
  # 6. DEPLOYMENT NOTIFICATION (LOGGING STEP)
  # ----------------------------------------------------------------------
  deployment_notification:
    runs-on: ubuntu-latest
    needs: [deploy_frontend_prod, deploy_backend_prod]
    if: always()

    steps:
      - name: Checkout code (required for this action)
        uses: actions/checkout@v4

      - name: Notify on Production Status (Slack)
        uses: slackapi/slack-github-action@v1.26.0
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        with:
          payload: |
            {
              "text": ":rocket: *DEPLOYMENT EVENT LOGGED!*",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": ":rocket: *Production Deployment Complete* :rocket:\n\n*Release:* `${{ github.ref_name }}`\n*Commit:* `${{ github.sha }}`\n\n*Frontend Status:* `${{ needs.deploy_frontend_prod.result }}`\n*Backend Status:* `${{ needs.deploy_backend_prod.result }}`"

                  }
                },
                {
                  "type": "actions",
                  "elements": [
                    {
                      "type": "button",
                      "text": {
                        "type": "plain_text",
                        "text": "View Workflow Run"
                      },
                      "url": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
                    }
                  ]
                }
              ]
            }
