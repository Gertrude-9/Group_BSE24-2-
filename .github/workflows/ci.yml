name: CI/CD for Blog Application

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  # ----------------------------------------------------------------------
  # 1. BUILD JOB (CI Quality Gate)
  # ----------------------------------------------------------------------
  build:
    runs-on: ubuntu-latest
    
    steps:
      # Step 1: Checkout repository
      - name: Checkout code
        uses: actions/checkout@v4

      # Frontend Setup (React + Vite)
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.13.1'

      - name: Install frontend dependencies
        run: npm install
        working-directory: ./team_blog_frontend

      - name: Run frontend tests and linting
        run: npm run lint && npm run test
        working-directory: ./team_blog_frontend

      - name: Build frontend (Generates 'dist')
        run: npm run build
        working-directory: ./team_blog_frontend
        
      # CRITICAL STEP: Upload the compiled 'dist' folder for deployment
      - name: Archive frontend build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: ./team_blog_frontend/dist

      # Backend Setup (Django + DRF)
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install backend dependencies
        run: pip install -r requirements.txt
        working-directory: ./team_blog_backend

      - name: Run backend tests and linting
        run: flake8 . && python manage.py test
        working-directory: ./team_blog_backend
        
  # ----------------------------------------------------------------------
  # 2. DEPLOY FRONTEND TO VERCEL (STAGING)
  # ----------------------------------------------------------------------
  deploy_frontend:
    needs: [build]
    runs-on: ubuntu-latest
    environment: staging_vercel 
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download frontend build artifact
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: ./team_blog_frontend/dist
        
      - name: Install Vercel CLI
        run: npm install -g vercel

      - name: Trigger Vercel Deployment via Hook
        run: curl -X POST ${{ secrets.VERCEL_DEPLOY_HOOK }}
          
  # ----------------------------------------------------------------------
  # 3. DEPLOY BACKEND TO RENDER (STAGING)
  # ----------------------------------------------------------------------
  deploy_backend:
    needs: [build]
    runs-on: ubuntu-latest
    environment: staging_render
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    
    steps:
      - name: Trigger Render Backend Staging Deployment
        run: |
          curl -X POST ${{ secrets.RENDER_DEPLOY_HOOK }}

  # ----------------------------------------------------------------------
  # 4. DEPLOY FRONTEND TO VERCEL (PRODUCTION)
  # ----------------------------------------------------------------------
  deploy_frontend_prod:
    needs: [build]
    runs-on: ubuntu-latest
    environment: production_vercel 
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download frontend build artifact
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: ./team_blog_frontend/dist
        
      - name: Install Vercel CLI
        run: npm install -g vercel

      - name: Trigger Vercel Deployment via Hook (Production)
        run: curl -X POST ${{ secrets.VERCEL_PROD_HOOK }}

  # ----------------------------------------------------------------------
  # 5. DEPLOY BACKEND TO RENDER (PRODUCTION)
  # ----------------------------------------------------------------------
  deploy_backend_prod:
    needs: [build]
    runs-on: ubuntu-latest
    environment: production_render
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    
    steps:
      - name: Trigger Render Backend Production Deployment
        run: |
          curl -X POST ${{ secrets.RENDER_PROD_HOOK }}

  # ----------------------------------------------------------------------
  # 6. DEPLOYMENT NOTIFICATION FOR STAGING (FIXED INDENTATION & DEPENDENCY)
  # ----------------------------------------------------------------------
  staging_notification:
    runs-on: ubuntu-latest
    # FIX: Listing both staging jobs here
    needs: [deploy_frontend, deploy_backend]
    if: always() && github.ref == 'refs/heads/main'
  
    steps:
      - name: Checkout code (required for this action)
        uses: actions/checkout@v4

      - name: Notify on Staging Status (Slack)
        uses: slackapi/slack-github-action@v1.26.0
          
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }} 
        with:
          slack-message: |
              :gear: *Staging Deployment Logged!* (Branch: ${{ github.ref_name }})
              
              - Frontend Status: ${{ needs.deploy_frontend.result }}
              - Backend Status: ${{ needs.deploy_backend.result }}
              
              View Full Workflow: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
              
  # ----------------------------------------------------------------------
  # 7. DEPLOYMENT NOTIFICATION FOR PRODUCTION (FIXED INDENTATION & DEPENDENCY)
  # ----------------------------------------------------------------------
  deployment_notification:
    runs-on: ubuntu-latest
    # FIX: Listing both production jobs here
    needs: [deploy_frontend_prod, deploy_backend_prod] 
    if: always() && startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Checkout code (required for this action)
        uses: actions/checkout@v4

      - name: Notify on Production Status (Slack)
        uses: slackapi/slack-github-action@v1.26.0
        
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }} 
        with:
          slack-message: |
              :rocket: *Production Deployment Logged!* (Release: ${{ github.ref_name }})
              
              - Frontend Status: ${{ needs.deploy_frontend_prod.result }}
              - Backend Status: ${{ needs.deploy_backend_prod.result }}
              
              View Full Workflow: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
